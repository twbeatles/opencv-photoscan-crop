[pytest]
testpaths = tests
python_files = test_*.py
# NOTE: tests manage their own QApplication lifecycle (create/quit per
# test) and must not share pytest-qt's event-loop hooks: with the plugin
# loaded, the watch-thread tests deadlock intermittently (no test uses
# qtbot/qapp fixtures). Re-enable explicitly if qtbot is ever adopted.
addopts = -ra -p no:pytest-qt
# Deadlock guardrail (pytest-timeout): fail with a stack dump instead of
# hanging CI forever. Well above the slowest legitimate test (~seconds).
timeout = 600
timeout_method = thread
markers =
    selftest: legacy integration selftest registry wrapper